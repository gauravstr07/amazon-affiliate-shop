<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="https://w7.pngwing.com/pngs/798/196/png-transparent-computer-icons-shopping-cart-e-commerce-add-to-cart-button-purple-angle-text-thumbnail.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Trending Tech Deals"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <!-- SEO Meta Tags -->
    <meta name="description" content="Trending Tech Deals - Discover the best discounts on gadgets and electronics. Find top-rated products on Amazon!" />
    <meta name="keywords" content="tech deals, gadgets, discounts, electronics, amazon deals, trending tech, best gadgets, tech products" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="TechDeals" />
    <meta name="language" content="en" />
    <meta name="revisit-after" content="7 days" />

    <!-- Open Graph Meta Tags for Facebook and other social platforms -->
    <meta property="og:title" content="Trending Tech Deals - Best Gadgets at Discounted Prices" />
    <meta property="og:description" content="Discover top-rated tech gadgets and electronics on Amazon with great discounts. Shop the latest deals now!" />
    <meta property="og:image" content="https://your-site.com/og-image.jpg" />
    <meta property="og:url" content="https://your-site.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TechDeals" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trending Tech Deals - Best Gadgets at Discounted Prices" />
    <meta name="twitter:description" content="Find top-rated gadgets and tech products with amazing discounts on Amazon. Shop now!" />
    <meta name="twitter:image" content="https://your-site.com/twitter-image.jpg" />
    <meta name="twitter:site" content="@techdeals" />
    <meta name="twitter:creator" content="@techdeals" />

    <!-- Apple Touch Icon for iOS devices -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Title of the page -->
    <title>Tech Deals - Best Gadgets at Discounted Prices</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "url": "https://your-site.com",
        "name": "TechDeals",
        "description": "Discover the latest tech deals and discounts on gadgets, electronics, and accessories on Amazon.",
        "publisher": {
          "@type": "Organization",
          "name": "TechDeals"
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://your-site.com/?search={search_term}",
          "query-input": "required name=search_term"
        }
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
